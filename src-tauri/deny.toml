# cargo-deny: advisories, licenses, bans and sources for the Rust backend.
# Run locally with `cargo deny check` from src-tauri/.

[graph]
# Vaultsweep ships for macOS only; don't fail on Linux/Windows-only crates.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
all-features = false

[advisories]
# Vulnerabilities and yanked crates fail; unmaintained only for direct deps.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
ignore = true

[bans]
# The Tauri tree pulls several majors of common crates; report, don't fail.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
